<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1120" width="1440" height="1120" role="img" aria-label="Company Brain Multi-Tenant SaaS End-to-End Sequential Flow Diagram">
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; rx: 14; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 21px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 12.5px; font-weight: 400; fill: #475569; }
      .actor-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .actor-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 500; fill: #475569; }
      .step-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 11.5px; font-weight: 600; fill: #0f172a; }
      .step-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 10.5px; font-weight: 500; fill: #334155; }
      .guard-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 11px; font-weight: 600; fill: #b45309; }
      .stage-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; fill: #475569; }
      .badge-num { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 10px; font-weight: 700; fill: #ffffff; }
      .alt-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 10.5px; font-weight: 700; fill: #9f1239; }
      .alt-cond { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 10.5px; font-weight: 600; fill: #475569; }
      .legend-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif; font-size: 11px; font-weight: 600; fill: #334155; }

      .lifeline { stroke: #cbd5e1; stroke-width: 1.4; stroke-dasharray: 5 5; }
      .stage-band { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 1; rx: 8; }
      .alt-frame { fill: #fffbfc; stroke: #fda4af; stroke-width: 1.4; stroke-dasharray: 6 4; rx: 8; }
      .alt-header { fill: #ffe4e6; stroke: #fda4af; stroke-width: 1; rx: 4; }

      .a-slack { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.5; rx: 8; }
      .a-api { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.5; rx: 8; }
      .a-wf { fill: #fffbeb; stroke: #f59e0b; stroke-width: 1.5; rx: 8; }
      .a-brain { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .a-agent { fill: #eef2ff; stroke: #6366f1; stroke-width: 1.5; rx: 8; }
      .a-policy { fill: #fff1f2; stroke: #f43f5e; stroke-width: 1.5; stroke-dasharray: 5 3; rx: 8; }
      .a-tools { fill: #fdf2f8; stroke: #ec4899; stroke-width: 1.5; rx: 8; }

      .note-pill { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; rx: 7; }
      .acl-box { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.5; rx: 8; }
      .sleep-pill { fill: #fef3c7; stroke: #f59e0b; stroke-width: 1.3; rx: 14; }
      .label-bg { fill: #ffffff; fill-opacity: 0.92; }

      .msg { stroke: #334155; stroke-width: 1.8; fill: none; }
      .msg-ret { stroke: #64748b; stroke-width: 1.6; stroke-dasharray: 5 4; fill: none; }
      .msg-guard { stroke: #d97706; stroke-width: 1.6; stroke-dasharray: 5 3; fill: none; }
      .msg-approve { stroke: #e11d48; stroke-width: 1.8; fill: none; }
      .msg-green { stroke: #059669; stroke-width: 1.8; fill: none; }
    </style>

    <marker id="arr" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#334155" />
    </marker>
    <marker id="arr-ret" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#64748b" />
    </marker>
    <marker id="arr-guard" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#d97706" />
    </marker>
    <marker id="arr-approve" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#e11d48" />
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#059669" />
    </marker>
  </defs>

  <!-- Canvas -->
  <rect class="bg" x="0" y="0" width="1440" height="1120" />
  <rect class="frame" x="18" y="16" width="1404" height="1088" />

  <!-- Header -->
  <text class="title" x="44" y="50">Company Brain SaaS — End-to-End Sequential Execution Flow</text>
  <text class="subtitle" x="44" y="71">Step-by-step lifecycle from Slack thread mention → ACL pre-filtered retrieval → ZDR LLM planning → Policy Gate &amp; Temporal Signal → cited reply</text>

  <!-- Legend -->
  <line x1="1068" y1="44" x2="1102" y2="44" class="msg" marker-end="url(#arr)" />
  <text class="legend-text" x="1110" y="48">Call / Dispatch</text>
  <line x1="1208" y1="44" x2="1242" y2="44" class="msg-ret" marker-end="url(#arr-ret)" />
  <text class="legend-text" x="1250" y="48">Return / Signal</text>
  <line x1="1068" y1="64" x2="1102" y2="64" class="msg-approve" marker-end="url(#arr-approve)" />
  <text class="legend-text" x="1110" y="68">Approval Gate (Ph 2)</text>
  <line x1="1244" y1="64" x2="1278" y2="64" class="msg-guard" marker-end="url(#arr-guard)" />
  <text class="legend-text" x="1286" y="68">ACL Guard</text>

  <line x1="44" y1="84" x2="1396" y2="84" stroke="#e2e8f0" stroke-width="1" />

  <!-- ==================== TOP ACTORS (centers: 120, 320, 520, 720, 920, 1120, 1320) ==================== -->
  <rect class="a-slack" x="34" y="96" width="172" height="52" />
  <text class="actor-title" x="120" y="118" text-anchor="middle">Teammate &amp; Slack</text>
  <text class="actor-sub" x="120" y="136" text-anchor="middle">packages/surfaces/slack</text>

  <rect class="a-api" x="234" y="96" width="172" height="52" />
  <text class="actor-title" x="320" y="118" text-anchor="middle">FastAPI + Redis</text>
  <text class="actor-sub" x="320" y="136" text-anchor="middle">apps/api</text>

  <rect class="a-wf" x="434" y="96" width="172" height="52" />
  <text class="actor-title" x="520" y="118" text-anchor="middle">Temporal Workflow</text>
  <text class="actor-sub" x="520" y="136" text-anchor="middle">apps/workers (agent-queue)</text>

  <rect class="a-brain" x="634" y="96" width="172" height="52" />
  <text class="actor-title" x="720" y="118" text-anchor="middle">Company Brain + RLS</text>
  <text class="actor-sub" x="720" y="136" text-anchor="middle">packages/brain · core</text>

  <rect class="a-agent" x="834" y="96" width="172" height="52" />
  <text class="actor-title" x="920" y="118" text-anchor="middle">Agent &amp; ZDR LLM</text>
  <text class="actor-sub" x="920" y="136" text-anchor="middle">packages/agent</text>

  <rect class="a-policy" x="1034" y="96" width="172" height="52" />
  <text class="actor-title" x="1120" y="118" text-anchor="middle">Policy Gate (Ph 2)</text>
  <text class="actor-sub" x="1120" y="136" text-anchor="middle">ceo_agent/policy.py</text>

  <rect class="a-tools" x="1234" y="96" width="172" height="52" />
  <text class="actor-title" x="1320" y="118" text-anchor="middle">Tools &amp; Sandbox</text>
  <text class="actor-sub" x="1320" y="136" text-anchor="middle">connectors · sandbox</text>

  <!-- ==================== STAGE BACKDROP BANDS ==================== -->
  <rect class="stage-band" x="34" y="160" width="1372" height="162" />
  <text class="stage-tag" x="46" y="176">Stage 1 — Ingress, Verification &amp; Durable Dispatch</text>

  <rect class="stage-band" x="34" y="332" width="1372" height="174" />
  <text class="stage-tag" x="46" y="348">Stage 2 — Tenant RLS &amp; Permission-Aware Retrieval (user ∩ channel)</text>

  <rect class="stage-band" x="34" y="516" width="1372" height="122" />
  <text class="stage-tag" x="46" y="532">Stage 3 — Grounded Reasoning, Citations &amp; Policy Classification</text>

  <rect class="alt-frame" x="34" y="648" width="1372" height="232" />
  <rect class="alt-header" x="34" y="648" width="44" height="22" />
  <text class="alt-tag" x="56" y="663" text-anchor="middle">ALT</text>
  <text class="stage-tag" x="88" y="663">Stage 4 — Bounded Tool Execution &amp; Human-in-the-Loop Approval Gate</text>

  <rect class="stage-band" x="34" y="890" width="1372" height="134" />
  <text class="stage-tag" x="46" y="906">Stage 5 — Audit Trail, Usage Metering &amp; Cited Delivery</text>

