[project]
name = "ceo-connectors"
version = "0.0.0"
description = "Native connectors and the tool registry."
requires-python = ">=3.12"
dependencies = ["ceo-core"]

[tool.uv.sources]
ceo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceo_connectors"]
