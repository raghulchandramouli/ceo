[project]
name = "ceo-surfaces"
version = "0.0.0"
description = "Slack client and Block Kit renderers shared by the API and workers."
requires-python = ">=3.12"
dependencies = ["ceo-core"]

[tool.uv.sources]
ceo-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceo_surfaces"]
