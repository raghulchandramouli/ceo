[project]
name = "ceo-workers"
version = "0.0.0"
description = "Temporal workers for interactive runs and connector sync."
requires-python = ">=3.12"
dependencies = [
    "ceo-agent",
    "ceo-brain",
    "ceo-connectors",
    "ceo-core",
    "ceo-surfaces",
    "pydantic-settings>=2.6",
    "temporalio>=1.11",
]

[tool.uv.sources]
ceo-agent = { workspace = true }
ceo-brain = { workspace = true }
ceo-connectors = { workspace = true }
ceo-core = { workspace = true }
ceo-surfaces = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceo_workers"]
