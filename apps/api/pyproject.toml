[project]
name = "ceo-api"
version = "0.0.0"
description = "FastAPI gateway for auth, webhooks, and the control plane."
requires-python = ">=3.12"
dependencies = [
    "ceo-agent",
    "ceo-connectors",
    "ceo-core",
    "ceo-surfaces",
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
ceo-agent = { workspace = true }
ceo-connectors = { workspace = true }
ceo-core = { workspace = true }
ceo-surfaces = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ceo_api"]
